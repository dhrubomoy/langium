<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monaco Editor Web</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        background: #141414;
        color: #e0e0e0;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .app {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 16px;
        gap: 10px;
      }
      header h1 {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #9ab4e8;
        text-transform: uppercase;
      }
      #monaco-editor-root {
        flex: 1;
        min-height: 0;
        border: 1px solid #2d2d2d;
        border-radius: 6px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Monaco Editor Web</h1>
      </header>
      <div id="monaco-editor-root"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
